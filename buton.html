<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .responsive-button {
      display: inline-block;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      color: white;
      background-color: #007BFF;
      border: none;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .responsive-button:hover {
      background-color: #0056b3;
    }

    /* Responsivitate: se adaptează la dimensiunea ecranului */
    @media (max-width: 600px) {
      .responsive-button {
        width: 100%;
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <a href="https://web.whatsapp.com/" class="responsive-button">Home</a>

</body>
</html>
